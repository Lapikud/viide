[project]
name = "qr-code"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Oluwatobiloba Promise Temitope", email = "oluwatobilobatemi05@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.108",
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "ldap3>=2.9.1",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "qrcode[pil]>=8.2",
    "sqlalchemy>=2.1.3",
]

[project.scripts]
qr-code = "qr_code:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
