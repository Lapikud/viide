name: Bug report
description: Report something in Viide that is not working.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Describe the problem in your own words. Do not post passwords, tokens, or private links."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: "Include what you expected and how to reproduce it, if you know."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Logs, screenshots, or other context (optional)
      description: "You can attach files here. Remove sensitive details first."
  - type: input
    id: discord
    attributes:
      label: Discord (optional)
      description: "Your account on the Lap server, if different from your GitHub name."
