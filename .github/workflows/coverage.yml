name: Coverage comment

# Posts the coverage comment on pull requests from forks, whose own runs only get
# read-only tokens. It never checks out or runs the pull request's code.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [Tests]
    types: [completed]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  comment:
    name: Post coverage comment
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read # Download the comment artifact from the Tests run
      contents: read
      pull-requests: write # Post the comment, and edit it on later runs
    steps:
      - name: Post comment
        uses: py-cov-action/python-coverage-comment-action@v4.5
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PR_RUN_ID: ${{ github.event.workflow_run.id }}
